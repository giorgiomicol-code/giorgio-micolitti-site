name: Build and publish redesign preview (v2) to gh-pages

on:
  push:
    branches:
      - redesign/giorgio-professional-site-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-preview-v2
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Add nojekyll marker
        run: touch dist/.nojekyll

      - name: Publish dist to gh-pages branch under /preview-v2/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: preview-v2
          keep_files: true
