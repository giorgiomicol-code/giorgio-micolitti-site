name: Build and publish preview to gh-pages

on:
  push:
    branches:
      - rebuild/giorgio-professional-site-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore local image assets
        shell: bash
        run: |
          mkdir -p public/images
          if compgen -G "image-data/*.b64" > /dev/null; then
            for f in image-data/*.b64; do
              name="$(basename "$f" .b64)"
              base64 --decode "$f" > "public/images/$name"
            done
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Add nojekyll marker
        run: touch dist/.nojekyll

      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
