name: Build and publish preview to gh-pages

on:
  push:
    branches:
      - rebuild/giorgio-professional-site-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify local project images
        shell: bash
        run: |
          set -euo pipefail
          test -s public/images/arco-sottovia.webp
          test -s public/images/ponte-zambra.webp
          test -s public/images/interno-galleria.webp
          test -s public/images/consolidamento-pendio.webp
          ! grep -R "lh3.googleusercontent.com/sitesv/" src public index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Add nojekyll marker
        run: touch dist/.nojekyll

      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
